# --- AUTH SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: default
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
  type: ClusterIP

---
# --- TEMPLATE SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: template
  namespace: default
spec:
  selector:
    app: template
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: ClusterIP

---
# --- RESUME SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: resume
  namespace: default
spec:
  selector:
    app: resume
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  type: ClusterIP
